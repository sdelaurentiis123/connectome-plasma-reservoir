[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "connectome-plasma-reservoir"
version = "0.1.0"
description = "Connectome reservoir experiments for plasma time series"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "networkx>=3.2", "scikit-learn>=1.4", "neuprint-python>=0.5"]
[project.optional-dependencies]
dev = ["pytest>=8"]
[tool.setuptools]
py-modules = ["reservoir", "data", "demo"]
[tool.pytest.ini_options]
testpaths = ["test_reservoir.py"]
